<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roadtrippers</title>
  <meta name="description" content="Roadtrip-planner voor twee: kaart, route, activiteiten, campings, gear, eten, budget en logboek.">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c89b3c'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' text-anchor='middle' fill='%2316181c'%3ERT%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/tarkov.css">

  <style>
    .boot {
      min-height: 100vh; display: grid; place-items: center;
      color: #5e6875; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    }
    .boot__mark {
      width: 34px; height: 34px; margin: 0 auto 14px;
      display: grid; place-items: center; border-radius: 7px;
      background: #c89b3c; color: #16181c;
      font-family: monospace; font-size: 16px; font-weight: 800;
      animation: bootpulse 1.2s ease-in-out infinite;
    }
    @keyframes bootpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
</head>
<body>

  <div id="app">
    <div class="boot">
      <div>
        <div class="boot__mark">RT</div>
        <div>Roadtrippers laden…</div>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <!-- instellingen eerst -->
  <script src="config.js"></script>

  <!-- kern -->
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/model.js"></script>
  <script src="js/ui.js"></script>

  <!-- tabs, in de volgorde waarin ze in de balk staan -->
  <script src="js/tab-map.js"></script>
  <script src="js/tab-route.js"></script>
  <script src="js/tab-activities.js"></script>
  <script src="js/tab-campsites.js"></script>
  <script src="js/tab-gear.js"></script>
  <script src="js/tab-food.js"></script>
  <script src="js/tab-budget.js"></script>
  <script src="js/tab-log.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
